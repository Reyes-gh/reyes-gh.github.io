<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foobar Covers Gallery (HD)</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(500px, 1fr));
            gap: 5px;
        }
        .gallery-item {
            position: relative;
            width: 100%;
            height: 500px;
            overflow: hidden;
            background-color: #1a1a1a;
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.2s ease;
        }
        .gallery-item img:hover {
            transform: scale(1.02);
        }
        #loading {
            text-align: center;
            font-size: 1.2rem;
            margin-top: 40px;
            color: #888;
        }
        @media (max-width: 520px) {
            .gallery-grid { grid-template-columns: 1fr; }
            .gallery-item { height: auto; aspect-ratio: 1 / 1; }
        }
    </style>
</head>
<body>

    <h1>Foobar Covers Gallery</h1>
    <div id="loading">Cargando carátulas...</div>
    <div class="gallery-grid" id="gallery"></div>

<script>
        const GITHUB_USER = "Reyes-gh";
        const REPO_NAME = "reyes-gh.github.io";
        const FOLDER_NAME = "covers";
        const GITHUB_READ_TOKEN = "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";

        async function loadCovers() {
            // Usamos el endpoint de trees con recursive=1 para listar la carpeta de golpe sin bloqueos CORS de contenidos
            const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/git/trees/main?recursive=1`;
            const gallery = document.getElementById("gallery");
            const loading = document.getElementById("loading");

            try {
                const headers = {
                    "Accept": "application/vnd.github+json"
                };
                if (GITHUB_READ_TOKEN) {
                    headers["Authorization"] = `Bearer ${GITHUB_READ_TOKEN}`;
                }

                const response = await fetch(apiUrl, { headers });
                if (!response.ok) throw new Error("No se pudo conectar con el repositorio.");
                
                const data = await response.json();
                
                // Filtramos los archivos que estén dentro de la carpeta covers/
                const imageExtensions = [".jpg", ".jpeg", ".png", ".webp", ".gif"];
                const images = data.tree.filter(item => {
                    if (!item.path.startsWith(FOLDER_NAME + "/")) return false;
                    const lowerName = item.path.toLowerCase();
                    return imageExtensions.some(ext => lowerName.endsWith(ext));
                });

                loading.style.display = "none";

                if (images.length === 0) {
                    gallery.innerHTML = "<p style='text-align:center; grid-column: 1/-1;'>No hay imágenes en la carpeta covers.</p>";
                    return;
                }

                // Ordenar de más reciente a más antiguo por nombre (gracias al timestamp)
                images.sort((a, b) => b.path.localeCompare(a.path));

                images.forEach(img => {
                    const itemDiv = document.createElement("div");
                    itemDiv.className = "gallery-item";

                    const imageElement = document.createElement("img");
                    // Construimos la URL Raw directamente
                    imageElement.src = `https://raw.githubusercontent.com/${GITHUB_USER}/${REPO_NAME}/refs/heads/main/${img.path}`;
                    imageElement.alt = img.path;
                    imageElement.loading = "lazy";

                    itemDiv.appendChild(imageElement);
                    gallery.appendChild(itemDiv);
                });

            } catch (error) {
                loading.textContent = "Error al cargar la galería: " + error.message;
            }
        }

        loadCovers();
    </script>

</body>
</html>
