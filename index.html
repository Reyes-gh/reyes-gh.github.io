<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foobar Covers Gallery</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(500px, 1fr));
            gap: 5px;
        }

        .gallery-item {
            position: relative;
            width: 100%;
            height: 500px;
            overflow: hidden;
            background-color: #1a1a1a;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.2s ease;
        }

        .gallery-item img:hover {
            transform: scale(1.02);
        }

        #loading {
            text-align: center;
            font-size: 1.2rem;
            margin-top: 40px;
            color: #888;
        }

        @media (max-width: 520px) {
            .gallery-grid {
                grid-template-columns: 1fr;
            }
            .gallery-item {
                height: auto;
                aspect-ratio: 1 / 1;
            }
        }
    </style>
</head>
<body>

    <h1>Foobar Covers Gallery</h1>
    <div id="loading">Cargando carátulas...</div>
    <div class="gallery-grid" id="gallery"></div>

    <script>
        const GITHUB_USER = "Reyes-gh";
        const REPO_NAME = "reyes-gh.github.io";
        const FOLDER_NAME = "covers";

        async function loadCovers() {
            const gallery = document.getElementById("gallery");
            const loading = document.getElementById("loading");

            try {
                // El parámetro ?t=... evita que el navegador guarde en caché el JSON viejo
                const response = await fetch(`images.json?t=${new Date().getTime()}`);
                if (!response.ok) throw new Error("No se pudo cargar el archivo de índice.");
                
                const images = await response.json();
                loading.style.display = "none";

                if (images.length === 0) {
                    gallery.innerHTML = "<p style='text-align:center; grid-column: 1/-1;'>No hay imágenes disponibles.</p>";
                    return;
                }

                images.forEach(filename => {
                    const itemDiv = document.createElement("div");
                    itemDiv.className = "gallery-item";

                    const imageElement = document.createElement("img");
                    // Construimos la URL Raw directa desde el nombre que está en el JSON
                    imageElement.src = `https://raw.githubusercontent.com/${GITHUB_USER}/${REPO_NAME}/refs/heads/main/${FOLDER_NAME}/${filename}`;
                    imageElement.alt = filename;
                    imageElement.loading = "lazy";

                    itemDiv.appendChild(imageElement);
                    gallery.appendChild(itemDiv);
                });

            } catch (error) {
                loading.textContent = "Error al cargar la galería: " + error.message;
            }
        }

        loadCovers();
    </script>

</body>
</html>
